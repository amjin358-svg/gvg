name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main, "cursor/interactive-movie-scaffold-9e11"]
    paths:
      - "gvg-os/**"
      - ".github/workflows/deploy-website-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gvg-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gvg-os/package-lock.json
      - name: Install
        run: npm ci
      - name: Build static website
        run: npm run build:website
        env:
          GITHUB_PAGES: "true"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gvg-os/apps/website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
